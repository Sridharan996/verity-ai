services:
  - type: web
    name: verity-ai-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: API_PREFIX
        value: /api
      - key: MONGODB_TIMEOUT_MS
        value: "3000"
      - key: CORS_ORIGINS
        value: "*"
      # Configure MONGODB_URI via Render Dashboard secret environment variables

